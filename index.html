<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة حجاز للتجارة العامة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1a472a; --secondary: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        header { background: var(--primary); color: var(--white); padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--secondary); }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: var(--white); border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .main-img { width: 100%; border-radius: 15px; border: 3px solid var(--secondary); margin-bottom: 20px; display: block; }
        .info-box { text-align: center; padding: 20px; background: #f9f9f9; border-radius: 10px; margin-bottom: 20px; }
        .btn-whatsapp { display: flex; align-items: center; justify-content: center; background: #25d366; color: white; text-decoration: none; padding: 18px; border-radius: 50px; font-weight: bold; font-size: 1.3rem; transition: transform 0.3s; }
        .btn-whatsapp:hover { transform: scale(1.05); }
        .btn-whatsapp i { margin-left: 10px; font-size: 1.5rem; }
        h1 { margin: 0; font-size: 2rem; }
        footer { text-align: center; padding: 20px; color: #777; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>شركة حجاز للتجارة العامة</h1>
    <p>أجود أنواع الدريس الحجازي والأعلاف</p>
</header>

<div class="container">
    <!-- صورتك الشخصية للموقع تظهر هنا -->
    <img src="hegaz.jpg" alt="شركة حجاز للتجارة" class="main-img">

    <div class="info-box">
        <h3><i class="fas fa-map-marker-alt" style="color: var(--primary);"></i> دمياط - طريق كوبري فارسكور العلوي</h3>
        <p>نحن ملتزمون بتوفير أفضل المنتجات الزراعية وتوريدها لجميع المحافظات بسرعة وكفاءة.</p>
    </div>

    <a href="https://wa.me/201145040429" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i> اطلب الآن عبر واتساب
    </a>
</div>

<footer>
    <p>&copy; 2026 جميع الحقوق محفوظة لشركة حجاز للتجارة</p>
</footer>

</body>
</html>
