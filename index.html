<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEGAZ GLOBAL | معرض الوسائط</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --dark: #000; --white: #ffffff; --gray: #111; }
        body { font-family: 'Times New Roman', serif; margin: 0; background: var(--dark); color: var(--white); scroll-behavior: smooth; overflow-x: hidden; }
        
        header { border-bottom: 1px solid #222; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; }
        .header-logo { color: var(--gold); font-weight: bold; letter-spacing: 4px; text-decoration: none; font-size: 1.5rem; }

        .hero { text-align: center; padding: 60px 5%; }
        .hero img { max-width: 400px; width: 80%; height: auto; margin-bottom: 20px; }
        .hero h1 { color: var(--gold); font-size: 2.5rem; letter-spacing: 8px; margin: 0; }

        section { padding: 40px 8%; border-top: 1px solid #111; }
        .section-title { text-align: center; color: var(--gold); letter-spacing: 5px; margin-bottom: 40px; font-size: 1.8rem; text-transform: uppercase; }

        /* --- معرض الصور (نمط ألبوم الهاتف) --- */
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .photo-item { aspect-ratio: 1/1; overflow: hidden; cursor: pointer; border: 1px solid #222; position: relative; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; filter: grayscale(30%); }
        .photo-item:hover img { transform: scale(1.1); filter: grayscale(0%); border: 1px solid var(--gold); }

        /* --- قسم الفيديوهات --- */
        .video-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .video-box { display: flex; flex-direction: column; }
        .video-label { color: var(--gold); padding: 10px 0; font-size: 1.2rem; font-weight: bold; text-align: center; border-bottom: 1px solid #111; margin-bottom: 15px; }
        .video-wrapper { width: 100%; height: 250px; background: #000; border: 1px solid #222; overflow: hidden; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }

        /* نافذة تصفح الصور (Modal) */
        .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { max-width: 90%; max-height: 80%; margin: auto; display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid var(--gold); }
        .close-modal { position: absolute; top: 30px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 999; text-decoration: none; }
        footer { padding: 40px; text-align: center; color: #444; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

<header>
    <a href="#" class="header-logo">HEGAZ</a>
    <div style="color: var(--gold); font-size: 0.7rem;">LOGISTICS & QUALITY</div>
</header>

<div class="hero">
    <img src="hegaz.png" alt="Hegaz Brand">
    <h1>GALLERY</h1>
</div>

<!-- معرض الصور الذكي -->
<section>
    <h2 class="section-title">PHOTO ALBUM | معرض الصور</h2>
    <div class="photo-gallery">
        <!-- كرر هذا السطر لكل صورة تملكها (حتى 1000 صورة) -->
        <div class="photo-item" onclick="openModal(this)"><img src="img1.jpg" alt="Hegaz"></div>
        <div class="photo-item" onclick="openModal(this)"><img src="img2.jpg" alt="Hegaz"></div>
        <div class="photo-item" onclick="openModal(this)"><img src="img3.jpg" alt="Hegaz"></div>
        <div class="photo-item" onclick="openModal(this)"><img src="img4.jpg" alt="Hegaz"></div>
        <div class="photo-item" onclick="openModal(this)"><img src="img5.jpg" alt="Hegaz"></div>
        <div class="photo-item" onclick="openModal(this)"><img src="img6.jpg" alt="Hegaz"></div>
        <!-- أضف المزيد هنا... -->
    </div>
</section>

<!-- قسم الفيديوهات المستقل -->
<section>
    <h2 class="section-title">VIDEOS | قسم الفيديوهات</h2>
    <div class="video-section">
        
        <div class="video-box">
            <div class="video-label">جولة داخل مخازن الشركة</div>
            <div class="video-wrapper">
                <video controls muted>
                    <source src="storage-video.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="video-box">
            <div class="video-label">تجهيز الشحنات الدولية</div>
            <div class="video-wrapper">
                <video controls muted>
                    <source src="shipping-video.mp4" type="video/mp4">
                </video>
            </div>
        </div>

    </div>
</section>

<!-- نافذة عرض الصورة (تفتح عند الضغط) -->
<div id="myModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="imgModal">
</div>

<a href="https://api.whatsapp.com/send?phone=201145040429" class="whatsapp-float" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<footer>HEGAZ GLOBAL &copy; 2026</footer>

<script>
    function openModal(element) {
        document.getElementById("myModal").style.display = "block";
        document.getElementById("imgModal").src = element.getElementsByTagName('img')[0].src;
    }
    function closeModal() {
        document.getElementById("myModal").style.display = "none";
    }
    // إغلاق النافذة عند الضغط في أي مكان خارج الصورة
    window.onclick = function(event) {
        if (event.target == document.getElementById("myModal")) {
            closeModal();
        }
    }
</script>

</body>
</html>
